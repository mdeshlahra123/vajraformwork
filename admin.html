<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VAJRA Orders">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<title>Orders · VAJRA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Follow-up desk: every lead has a stage, a dated next step, and a last-contact time. */
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#0a0a0b; --muted:#71717a; --muted2:#a1a1aa; --line:#e4e4e7; --line2:#f1f1f3;
  --navy:#0f1b2d; --navy2:#1F3A5F; --ring:#1F3A5F33; --wa:#1fa855; --r:12px; --shadow:0 1px 2px #0000000d,0 1px 3px #0000000a;
  /* stage colours: each stage has its own */
  --hot:#c2410c; --hot-bg:#ffedd5;  --est:#6d28d9; --est-bg:#ede9fe;  --quo:#7c3aed; --quo-bg:#f5f3ff;
  --cb:#1d4ed8; --cb-bg:#dbeafe;    --thk:#0f766e; --thk-bg:#ccfbf1;  --na:#52525b; --na-bg:#e4e4e7;
  --dsp:#b45309; --dsp-bg:#fef3c7;  --fb:#15803d; --fb-bg:#dcfce7;    --won:#854d0e; --won-bg:#fde68a;
  --lost:#b91c1c; --lost-bg:#fee2e2; --done:#3f3f46; --done-bg:#f4f4f5;
  --over:#b91c1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#d9b763,#a88232);display:grid;place-items:center;color:#0f1b2d;font-weight:800;font-size:15px}
.brand b{font-weight:600;font-size:15px}
.brand small{display:block;color:#ffffff99;font-size:11px;margin-top:-2px}
.sp{flex:1}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid #ffffff26;background:#ffffff0d;color:#fff}
.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.wrap{max-width:1180px;margin:0 auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
@media(min-width:960px){.wrap.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}}

/* today summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;box-shadow:var(--shadow);min-height:62px;display:flex;flex-direction:column;justify-content:space-between}
.st .n{font-size:20px;font-weight:700;line-height:1.1}
.st .l{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.2}
.st.red .n{color:var(--over)} .st.vio .n{color:var(--est)} .st.org .n{color:var(--hot)}
.st[aria-pressed="true"]{border-color:var(--navy2);box-shadow:0 0 0 3px var(--ring)}

.tools{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:10;background:var(--bg);padding:10px 12px 8px;margin:0 -12px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted2)}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 40px 0 38px;font-size:16px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--ring)}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500;color:#3f3f46;display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip b{color:var(--muted2);font-weight:600}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] b{color:#ffffffaa}

/* list */
.list{display:grid;gap:12px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gh{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafafa;border-bottom:1px solid var(--line2)}
.gh b{margin-left:auto;color:var(--muted2)}
.gh.red{color:var(--over)}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-bottom:1px solid var(--line2);position:relative}
.item:last-child{border-bottom:0}
.item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--sc,transparent)}
.item:active,.item[aria-current="true"]{background:#f4f6fa}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.mid{min-width:0;flex:1}
.nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.why{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;font-weight:600;color:#27272a}
.why svg{width:13px;height:13px;color:var(--muted)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;max-width:42%}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.due{font-size:11.5px;font-weight:600;color:var(--muted)}
.due.over{color:var(--over)} .due.today{color:var(--dsp)}
.last{font-size:11px;color:var(--muted2);white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.sk{height:62px;border-bottom:1px solid var(--line2);padding:12px 14px;display:flex;gap:12px;align-items:center}
.sk span{display:block;border-radius:6px;background:linear-gradient(90deg,#f0f0f2,#e7e7ea,#f0f0f2);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* detail sheet */
.scrim{position:fixed;inset:0;background:#0a0a0b66;z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px #0000001f}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:9px;background:#d4d4d8;margin:8px auto 2px;flex:none}
.sh-h{display:flex;gap:12px;align-items:flex-start;padding:10px 16px 12px;border-bottom:1px solid var(--line2);flex:none}
.sh-h .nm{font-size:17px;white-space:normal}
.sh-b{overflow-y:auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom))}
.x{border:0;background:#f4f4f5;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#52525b;flex:none}
@media(min-width:960px){
  .scrim{display:none}
  .sheet{position:sticky;top:76px;transform:none;border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 92px);box-shadow:var(--shadow);transition:none}
  .sheet .grab{display:none}
  .sheet.idle .sh-h,.sheet.idle .sh-b{display:none}
  .sheet.idle::after{content:"Select a lead to see the details";display:block;padding:60px 20px;text-align:center;color:var(--muted)}
}
.meta2{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;font-size:12px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-weight:600;font-size:13.5px;text-decoration:none;color:var(--fg);text-align:center;line-height:1.15}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{min-height:34px;font-size:12.5px;padding:0 10px;border-radius:8px}
.next{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;background:#fafafa}
.next .t{display:flex;align-items:center;gap:8px;font-weight:600}
.next .t span{margin-left:auto;font-size:12.5px}
.dates{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button,.dates label{flex:none;height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;position:relative}
.dates button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.dates input[type=date]{position:absolute;inset:0;opacity:0;width:100%}
.sec{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sec h3,.sec summary{margin:0;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px}
.sec summary{cursor:pointer;list-style:none;display:flex;align-items:center}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:"▾";margin-left:auto;font-size:13px}
.sec details[open] summary::after{content:"▴"}
.kv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line2);min-height:44px}
.kv .k{width:92px;flex:none;color:var(--muted);font-size:12.5px}
.kv .v{flex:1;min-width:0;font-weight:500;word-break:break-word}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.mini{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.sw{position:relative;width:40px;height:24px;border-radius:99px;background:#d4d4d8;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:left .15s}
.sw[aria-checked="true"]{background:var(--fb)} .sw[aria-checked="true"]::after{left:19px}
.tog{display:flex;align-items:center;gap:8px;font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 12px}
.opt{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px;text-align:left}
.opt i{width:8px;height:8px;border-radius:50%;flex:none}
.opt[aria-pressed="true"]{border-color:var(--navy2);background:#eef2f8;font-weight:600;box-shadow:0 0 0 2px var(--ring)}
.fbk{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.fbk .opt{min-height:34px;border-radius:999px;padding:0 12px}
.hist{padding:0 12px 10px;font-size:13px;white-space:pre-wrap;color:#27272a;max-height:180px;overflow:auto}
.hist:empty::before{content:"No notes yet";color:var(--muted2)}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;font-size:15px}
textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--ring)}
.addn{padding:0 12px 12px;display:grid;gap:8px}
.addn .btn{justify-self:end}

/* log-a-call sheet */
.pop{position:fixed;inset:auto 0 0 0;z-index:61;background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s;box-shadow:0 -8px 30px #00000026;max-height:92vh;overflow:auto}
.pop.on{transform:none}
.pop h4{margin:0;font-size:16px}
.pop p.s{margin:2px 0 12px;color:var(--muted);font-size:13px}
.oc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oc button{display:flex;align-items:center;gap:9px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-size:13.5px;font-weight:500;text-align:left}
.oc button i{width:10px;height:10px;border-radius:50%;flex:none}
.oc button[aria-pressed="true"]{border-color:var(--navy2);background:#eef2f8;font-weight:600;box-shadow:0 0 0 2px var(--ring)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}
.scrim2{position:fixed;inset:0;background:#0a0a0b66;z-index:60}
@media(min-width:960px){.pop{left:50%;right:auto;bottom:auto;top:8%;width:460px;border-radius:16px;transform:translate(-50%,0) scale(.97);opacity:0;pointer-events:none}
  .pop.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:80;display:grid;gap:8px;width:min(92vw,380px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;font-size:13.5px;box-shadow:0 8px 24px #0003;animation:up .2s}
.toast.err{background:#7f1d1d}
@keyframes up{from{transform:translateY(8px);opacity:0}}

.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 500px at 50% -10%,#1F3A5F 0,#0f1b2d 60%)}
.lcard{width:min(100%,360px);background:var(--card);border-radius:18px;padding:26px 22px;box-shadow:0 20px 50px #0006}
.lcard .mark{width:42px;height:42px;font-size:20px;border-radius:12px;margin-bottom:14px}
.lcard h1{font-size:20px;margin:0 0 4px}
.lcard p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.lcard label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.lcard input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:22px;letter-spacing:.5em;text-align:center}
.lcard .btn{width:100%;margin-top:12px;min-height:48px;font-size:15px}
.lerr{color:var(--lost);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form class="lcard" id="lf" autocomplete="off">
    <div class="mark" aria-hidden="true">V</div>
    <h1>VAJRA Admin</h1>
    <p>Leads, samples and follow-ups. Enter the team PIN.</p>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="current-password" required>
    <button class="btn dark" type="submit" id="lbtn">Continue</button>
    <div class="lerr" id="lerr" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
  <header class="top"><div class="top-in">
    <div class="brand"><div class="mark" aria-hidden="true">V</div><div><b>Follow-ups</b><small id="upd">VAJRA Admin</small></div></div>
    <div class="sp"></div>
    <button class="ib" id="reload" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="ib" id="logout" aria-label="Log out"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
  </div></header>

  <div class="wrap split">
    <main>
      <div class="sum" role="group" aria-label="Summary">
        <button class="st" data-v="today"><span class="n" id="n-today">–</span><span class="l">To do today</span></button>
        <button class="st red" data-v="overdue"><span class="n" id="n-overdue">–</span><span class="l">Overdue</span></button>
        <button class="st vio" data-v="est"><span class="n" id="n-est">–</span><span class="l">Estimates owed</span></button>
        <button class="st org" data-v="hot"><span class="n" id="n-hot">–</span><span class="l">Hot leads</span></button>
      </div>
      <div class="tools">
        <div class="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label class="sr" for="q">Search</label>
          <input id="q" type="search" placeholder="Search name, phone, city" enterkeyhint="search" autocomplete="off">
          <button class="clr" id="qclr" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Stage"></div>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="sheet idle" id="sheet" aria-label="Lead details">
      <div class="grab" aria-hidden="true"></div>
      <div class="sh-h" id="shh"></div>
      <div class="sh-b" id="shb"></div>
    </aside>
  </div>
</div>

<div class="scrim2" id="scrim2" hidden></div>
<div class="pop" id="logp" role="dialog" aria-modal="true" aria-labelledby="logT" hidden>
  <h4 id="logT">How did it go?</h4>
  <p class="s" id="logS"></p>
  <div class="oc" id="logO"></div>
  <div class="lbl" id="logDL">Next follow-up</div>
  <div class="dates" id="logD"></div>
  <div class="lbl">Note (optional)</div>
  <label class="sr" for="logN">Note</label>
  <textarea id="logN" placeholder="e.g. 2 slabs in Dec, wants 30 sheets, call after 6 pm"></textarea>
  <div class="row2"><button class="btn" type="button" id="logNo">Cancel</button><button class="btn dark" type="button" id="logOk">Save</button></div>
</div>
<div class="pop" id="trk" role="dialog" aria-modal="true" aria-labelledby="trkT" hidden>
  <h4 id="trkT">Tracking ID</h4>
  <p class="s" id="trkS"></p>
  <div class="field"><label class="sr" for="trkI">Tracking ID</label><input id="trkI" class="mono" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
  <div class="row2"><button class="btn" type="button" id="trkNo">Cancel</button><button class="btn dark" type="button" id="trkOk">Save</button></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
let DATA = { orders: [], statuses: [], feedback: [], today: "" }, VIEW = "today", SEL = null, CALLED = null;

/* ---------- icons ---------- */
const P = {

const ORDER = ["lost", "won", "hot", "est", "quo", "cb", "thk", "na", "dsp", "fb", "done"];   // which test wins

const col = (s) => [`var(--${s.c})`, `var(--${s.c}-bg)`];
const ACTIVE = new Set(["hot", "est", "cb", "quo", "dsp", "fb", "thk", "na"]);

/* ---------- dates (IST) ---------- */
const D = (s) => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return Date.UTC(y, m - 1, d); };
const days = (a, b) => Math.round((D(a) - D(b)) / 864e5);
const plus = (n) => new Date(D(DATA.today) + n * 864e5).toISOString().slice(0, 10);
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function dueOf(o) {   // the date the next step is due, or "" (no date) / null (nothing to do)
  const s = stageOf(o);
  if (!ACTIVE.has(s.k)) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(o.next)) return o.next;
  if (["hot", "est", "dsp"].includes(s.k)) return DATA.today;            // act now
  if (s.k === "fb") return o.feedback === "Asked" ? "" : DATA.today;    // asked: waiting for a reply
  return "";                                                             // needs a date
}
function dueLabel(d) {
  if (d === null) return { t: "", c: "" };
  if (!d) return { t: "No date set", c: "" };
  const n = days(d, DATA.today);
  if (n < 0) return { t: n === -1 ? "Overdue · yesterday" : `Overdue · ${-n} days`, c: "over" };
  if (n === 0) return { t: "Today", c: "today" };
  if (n === 1) return { t: "Tomorrow", c: "" };
  const dt = new Date(D(d));
  return { t: n < 7 ? WD[dt.getUTCDay()] : `${dt.getUTCDate()} ${MO[dt.getUTCMonth()]}`, c: "" };
}
function lastLabel(o) {
  if (!o.last) return "";
  const n = days(DATA.today, o.last.slice(0, 10));
  const tm = o.last.slice(11, 16);
  const h = tm ? (() => { let [H, M] = tm.split(":").map(Number); const ap = H >= 12 ? "pm" : "am"; H = H % 12 || 12; return `${H}:${String(M).padStart(2, "0")} ${ap}`; })() : "";
  return n <= 0 ? `today ${h}` : n === 1 ? `yesterday` : `${n} days ago`;
}

/* ---------- list ---------- */
const VIEWS = {

  overdue: { t: "Overdue", test: (o) => { const d = dueOf(o); return d && days(d, DATA.today) < 0; } },
  est:     { t: "Estimates", test: (o) => stageOf(o).k === "est" },

function grp(title, items, cls = "") {

function sortTask(a, b) {

  return (da || "9999").localeCompare(db || "9999") || stageOf(a).pri - stageOf(b).pri || b.row - a.row;

function render() {

  const cnt = { today: os.filter(VIEWS.today.test).length, overdue: os.filter(VIEWS.overdue.test).length,
                est: os.filter(VIEWS.est.test).length, hot: os.filter(VIEWS.hot.test).length };
  for (const k in cnt) $("#n-" + k).textContent = cnt[k];
  $$(".st").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === VIEW));
  // stage chips with counts
  const sc = Object.fromEntries(STAGES.map((s) => [s.k, 0])); os.forEach((o) => sc[stageOf(o).k]++);
  $("#chips").innerHTML = [`<button class="chip" data-v="today" aria-pressed="${VIEW === "today"}">Today <b>${cnt.today}</b></button>`]
    .concat(STAGES.filter((s) => sc[s.k]).map((s) => `<button class="chip" data-v="s:${s.k}" aria-pressed="${VIEW === "s:" + s.k}"><i style="background:var(--${s.c})"></i>${esc(s.t)} <b>${sc[s.k]}</b></button>`))
    .concat([`<button class="chip" data-v="all" aria-pressed="${VIEW === "all"}">All <b>${os.length}</b></button>`]).join("");
  $("#qclr").hidden = !q;

  const match = (o) => !q || [o.name, o.phone, o.city, o.state, o.tracking, o.notes, o.address].join(" ").toLowerCase().includes(q);
  let html = "";
  if (q) {   // search: everything that matches, grouped by stage
    const m = os.filter(match);
    html = STAGES.map((s) => grp(s.t, m.filter((o) => stageOf(o).k === s.k).sort(sortTask))).join("");
  } else if (VIEW === "today") {
    const act = os.filter((o) => due(o) !== null);

}

      ${!ship ? kv("Address", esc(o.address), copy(o.address, "address")) : ""}
    </section>
    <section class="sec"><details><summary>Change stage by hand</summary>
      <div class="opts" role="group" aria-label="Status">${DATA.statuses.map((st) => { const sg = stageOf({ ...o, status: st }); return `<button class="opt" data-act="status" data-val="${esc(st)}" aria-pressed="${st === o.status}"><i style="background:var(--${sg.c})"></i>${esc(st.replace(/^\S+\s/, ""))}</button>`; }).join("")}</div>
    </details></section>`;
}

async function save(o, field, value, okMsg) {
  const before = { ...o };
  o[field] = field === "tracking_sent" ? value === "true" : value;
  if (SEL === o.row) drawDetail(o); render();
  try {
    const j = await api("update", { method: "POST", body: JSON.stringify({ row: o.row, field, value }) });
    if (j.status) o.status = j.status;
    if (SEL === o.row) drawDetail(o); render();
    toast((okMsg || "Saved") + (j.status ? " · stage → " + stageOf(o).t : ""));
  } catch (e) { if (e.message === "login") return; Object.assign(o, before); if (SEL === o.row) drawDetail(o); render(); toast("Not saved: " + e.message, true); }
}
async function logIt(o, outcome, next, note, okMsg) {
  try {
    const j = await api("log", { method: "POST", body: JSON.stringify({ row: o.row, outcome, next, note }) });
    Object.assign(o, { last: j.last, attempts: j.attempts, next: j.next, status: j.status }, j.notes !== undefined ? { notes: j.notes } : {});
    if (SEL === o.row) drawDetail(o); render();
    const dl = dueLabel(j.next || null);
    toast((okMsg || "Logged") + (j.next ? " · next: " + dl.t : ""));
  } catch (e) { if (e.message !== "login") toast("Not saved: " + e.message, true); }
}

/* ---------- log-a-call sheet ---------- */
function popOpen(id) { const p = $(id); p.hidden = false; $("#scrim2").hidden = false; requestAnimationFrame(() => p.classList.add("on")); }
function popClose(id) { const p = $(id); p.classList.remove("on"); $("#scrim2").hidden = true; setTimeout(() => { p.hidden = true; }, 220); }
function openLog(o, afterCall) {
  let pick = null, date = null;
  $("#logT").textContent = afterCall ? "Call done. How did it go?" : "Log a call";
  $("#logS").textContent = o.name + (o.attempts ? ` · ${o.attempts} missed before` : "");
  $("#logN").value = "";
  const draw = () => {
    $("#logO").innerHTML = OUT.map((x) => `<button type="button" data-oc="${x.k}" aria-pressed="${pick === x.k}"><i style="background:var(--${x.c})"></i>${esc(x.t)}</button>`).join("");
    const oc = OUT.find((x) => x.k === pick);
    const show = !!oc && oc.days !== null;
    $("#logDL").hidden = $("#logD").hidden = !show;
    if (show) {
      if (date === null) date = plus(pick === "no_answer" && o.attempts + 1 >= 3 ? 3 : oc.days);
      $("#logDL").textContent = oc.needDate ? "When to call back?" : "Next follow-up";
      $("#logD").innerHTML = dateChips(date, "ld");
    }
    $("#logOk").disabled = !pick;
  };
  $("#logO").onclick = (e) => { const b = e.target.closest("[data-oc]"); if (!b) return; pick = b.dataset.oc; date = null; draw(); };
  $("#logD").onclick = (e) => { const b = e.target.closest("[data-ld]"); if (b) { date = b.dataset.ld; draw(); } };
  $("#logD").onchange = (e) => { if (e.target.matches("[data-ldpick]") && e.target.value) { date = e.target.value; draw(); } };
  const done = (ok) => {
    popClose("#logp"); $("#scrim2").onclick = null;
    if (!ok || !pick) return;
    const oc = OUT.find((x) => x.k === pick);
    logIt(o, pick, oc.days === null ? "" : date, $("#logN").value, oc.t);
  };
  $("#logOk").onclick = () => done(true); $("#logNo").onclick = () => done(false); $("#scrim2").onclick = () => done(false);
  draw(); popOpen("#logp");
}
function openTrack(o) {
  const inp = $("#trkI");
  $("#trkT").textContent = o.tracking ? "Edit tracking ID" : "Add tracking ID";
  $("#trkS").textContent = o.name + (/Pending|Not sent|^$/.test(o.status || "") ? " · stage will change to Sent" : "");
  inp.value = o.tracking || ""; popOpen("#trk"); setTimeout(() => inp.focus(), 120);
  const done = (v) => { popClose("#trk"); $("#trkOk").onclick = $("#trkNo").onclick = $("#scrim2").onclick = inp.onkeydown = null;
    if (v !== null && v !== (o.tracking || "")) save(o, "tracking", v, "Tracking saved"); };
  $("#trkOk").onclick = () => done(inp.value.trim().toUpperCase()); $("#trkNo").onclick = $("#scrim2").onclick = () => done(null);
  inp.onkeydown = (e) => { if (e.key === "Enter") done(inp.value.trim().toUpperCase()); if (e.key === "Escape") done(null); };
}

/* ---------- events ---------- */
$("#list").addEventListener("click", (e) => { const b = e.target.closest(".item"); if (b) openDetail(Number(b.dataset.row)); });
$("#sheet").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act],[data-nx]"); if (!b) return;
  const o = byRow(SEL);
  if (b.dataset.act === "close") return closeDetail();
  if (!o) return;
  if ("nx" in b.dataset) return save(o, "next", b.dataset.nx, b.dataset.nx ? "Follow-up set: " + dueLabel(b.dataset.nx).t : "Follow-up date cleared");
  const act = b.dataset.act;
  if (act === "call") { CALLED = o.row; return; }   // outcome sheet opens when you come back to the page
  if (act === "log") return openLog(o);
  if (act === "copy") { try { await navigator.clipboard.writeText(b.dataset.val); toast("Copied"); } catch { toast("Copy not allowed here", true); } return; }
  if (act === "track") return openTrack(o);
  if (act === "tsent") return save(o, "tracking_sent", String(!o.tracking_sent), o.tracking_sent ? "Marked not sent" : "Marked as sent");
  if (act === "status") return b.dataset.val !== o.status && save(o, "status", b.dataset.val, "Stage saved");
  if (act === "fb") return b.dataset.val !== (o.feedback || "") && save(o, "feedback", b.dataset.val, "Feedback saved");
  if (act === "note") { const v = $("#noteI").value.trim(); return v ? logIt(o, "talked", o.next || plus(3), v, "Note added") : toast("Write a note first", true); }
  if (act === "wa") {   // WhatsApp opens in a new tab: record that we messaged
    const k = b.dataset.kind;
    if (k === "track" && !o.tracking_sent) await save(o, "tracking_sent", "true", "Tracking marked as sent");
    if (k === "ask" && !o.feedback) await save(o, "feedback", "Asked", "Feedback marked as asked");
    logIt(o, "messaged", "", "", "WhatsApp logged");
  }
});
$("#sheet").addEventListener("change", (e) => { if (e.target.matches("[data-nxpick]") && e.target.value) { const o = byRow(SEL); if (o) save(o, "next", e.target.value, "Follow-up set: " + dueLabel(e.target.value).t); } });
document.addEventListener("visibilitychange", () => {   // back from the phone app -> ask how the call went
  if (document.visibilityState === "visible" && CALLED) { const o = byRow(CALLED); CALLED = null; if (o) setTimeout(() => openLog(o, true), 300); }
});
$("#scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && SEL && $("#logp").hidden && $("#trk").hidden) closeDetail(); });
$$(".st").forEach((b) => b.addEventListener("click", () => { VIEW = VIEW === b.dataset.v && b.dataset.v !== "today" ? "today" : b.dataset.v; render(); }));
$("#chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) { VIEW = b.dataset.v; render(); } });
$("#q").addEventListener("input", render);
$("#qclr").addEventListener("click", () => { $("#q").value = ""; render(); $("#q").focus(); });
$("#reload").addEventListener("click", () => load(true));
$("#logout").addEventListener("click", async () => { await api("logout", { method: "POST" }).catch(() => {}); screen("login"); });
(() => { let y0 = null; const sh = $("#sheet");
  sh.addEventListener("touchstart", (e) => { if (e.target.closest(".sh-b")) return; y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener("touchend", (e) => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 70) closeDetail(); y0 = null; });
})();
$("#lf").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#lerr").textContent = ""; $("#lbtn").disabled = true; $("#lbtn").textContent = "Checking…";
  try { await api("login", { method: "POST", body: JSON.stringify({ pin: $("#pin").value }) }); $("#pin").value = ""; await load(); }
  catch (err) { $("#lerr").textContent = err.message === "Galat PIN" ? "Wrong PIN. Try again." : err.message; $("#pin").select(); }
  finally { $("#lbtn").disabled = false; $("#lbtn").textContent = "Continue"; }
});
async function load(manual) {
  if (!DATA.orders.length) skeleton();
  $("#reload").classList.add("spin");
  try {
    DATA = await api("orders"); screen("app"); render();
    if (SEL && byRow(SEL)) drawDetail(byRow(SEL));
    $("#upd").textContent = "Updated " + new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
    if (manual) toast("Refreshed");
  } catch (e) { if (e.message !== "login") toast("Could not load: " + e.message, true); }
  finally { $("#reload").classList.remove("spin"); }
}
screen("app"); load();
</script>
</body>
