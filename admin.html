<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VAJRA Orders">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<title>Orders · VAJRA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design: shadcn/ui-style neutrals (zinc), VAJRA navy + gold accents. List -> detail sheet pattern. */
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#0a0a0b; --muted:#71717a; --muted2:#a1a1aa; --line:#e4e4e7; --line2:#f1f1f3;
  --navy:#0f1b2d; --navy2:#1F3A5F; --gold:#c8a24a; --ring:#1F3A5F33;
  --amber:#b45309; --amber-bg:#fef3c7; --green:#15803d; --green-bg:#dcfce7; --blue:#3730a3; --blue-bg:#e0e7ff;
  --red:#b91c1c; --red-bg:#fee2e2; --orange:#c2410c; --orange-bg:#ffedd5; --grey-bg:#f4f4f5;
  --wa:#1fa855; --r:12px; --shadow:0 1px 2px #0000000d, 0 1px 3px #0000000a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);
  font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#d9b763,#a88232);display:grid;place-items:center;color:#0f1b2d;font-weight:800;font-size:15px}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:#ffffff99;font-size:11px;margin-top:-2px}
.sp{flex:1}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid #ffffff26;background:#ffffff0d;color:#fff}
.ib:active{background:#ffffff1f}
.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
@media(min-width:960px){.wrap.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}}

/* ---------- stats (they are the filters) ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;box-shadow:var(--shadow);min-height:64px;display:flex;flex-direction:column;justify-content:space-between}
.stat .n{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.2}
.stat .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.stat[aria-pressed="true"]{border-color:var(--navy2);box-shadow:0 0 0 3px var(--ring)}
@media(max-width:380px){.stat .n{font-size:18px}.stat .l{font-size:10.5px}}

/* ---------- search + tabs ---------- */
.tools{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:10;background:var(--bg);padding:10px 0 8px;margin:0 -12px;padding-inline:12px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted2)}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 40px 0 38px;font-size:16px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--ring)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px}
.seg{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500;color:#3f3f46}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg .c{color:var(--muted2);margin-left:4px;font-weight:600}
.seg button[aria-pressed="true"] .c{color:#ffffffaa}

/* ---------- list ---------- */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.item:active,.item[aria-current="true"]{background:#f4f6fa}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;letter-spacing:.02em}
.mid{min-width:0;flex:1}
.nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.next{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:11.5px;font-weight:600;color:var(--navy2);background:#eef2f8;border-radius:6px;padding:2px 7px}
.next svg{width:12px;height:12px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.chev{color:var(--muted2)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--grey-bg);color:#3f3f46}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.t-amber{background:var(--amber-bg);color:var(--amber)} .t-green{background:var(--green-bg);color:var(--green)}
.t-blue{background:var(--blue-bg);color:var(--blue)} .t-red{background:var(--red-bg);color:var(--red)} .t-orange{background:var(--orange-bg);color:var(--orange)}
.month{font-size:11px;color:var(--muted2);font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.sk{height:62px;border-bottom:1px solid var(--line2);padding:12px 14px;display:flex;gap:12px;align-items:center}
.sk span{display:block;border-radius:6px;background:linear-gradient(90deg,#f0f0f2,#e7e7ea,#f0f0f2);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- detail (bottom sheet on phone, side panel on desktop) ---------- */
.scrim{position:fixed;inset:0;background:#0a0a0b66;z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px #0000001f}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:9px;background:#d4d4d8;margin:8px auto 2px;flex:none}
.sh-h{display:flex;gap:12px;align-items:flex-start;padding:10px 16px 12px;border-bottom:1px solid var(--line2);flex:none}
.sh-h .nm{font-size:17px;white-space:normal}
.sh-b{overflow-y:auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.x{border:0;background:var(--grey-bg);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#52525b;flex:none}
@media(min-width:960px){
  .scrim{display:none}
  .sheet{position:sticky;top:76px;left:auto;right:auto;bottom:auto;transform:none;border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 92px);box-shadow:var(--shadow);transition:none}
  .sheet .grab{display:none}
  .sheet.idle .sh-h,.sheet.idle .sh-b{display:none}
  .sheet.idle::after{content:"Select an order to see details";display:block;padding:60px 20px;text-align:center;color:var(--muted)}
}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-weight:600;font-size:13.5px;text-decoration:none;color:var(--fg);text-align:center;line-height:1.15}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{min-height:34px;font-size:12.5px;padding:0 10px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.sec{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sec h3{margin:0;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px 0}
.kv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);min-height:44px}
.kv:last-child{border-bottom:0}
.kv .k{width:92px;flex:none;color:var(--muted);font-size:12.5px}
.kv .v{flex:1;min-width:0;font-weight:500;word-break:break-word}
.kv .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.mini{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.mini:active{background:var(--grey-bg)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:#3f3f46}
.sw{position:relative;width:40px;height:24px;border-radius:99px;background:#d4d4d8;border:0;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:left .15s}
.sw[aria-checked="true"]{background:var(--green)} .sw[aria-checked="true"]::after{left:19px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px 12px}
.opt{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--navy2);background:#eef2f8;font-weight:600;box-shadow:0 0 0 2px var(--ring)}
.fb{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px}
.fb .opt{min-height:34px;border-radius:999px;padding:0 12px}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;font-size:15px}
textarea:focus,.field input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--ring)}
.note-wrap{padding:10px 12px 12px;display:grid;gap:8px}
.note-wrap .btn{justify-self:end}

/* ---------- small input sheet (tracking) ---------- */
.ask{position:fixed;inset:auto 0 0 0;z-index:61;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s;box-shadow:0 -8px 30px #00000026}
.ask.on{transform:none}
.ask h4{margin:0 0 4px;font-size:16px}
.ask p{margin:0 0 12px;color:var(--muted);font-size:13px}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.03em}
.ask .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.scrim2{position:fixed;inset:0;background:#0a0a0b66;z-index:60}
@media(min-width:960px){.ask{left:50%;right:auto;bottom:auto;top:30%;width:420px;transform:translate(-50%,0) scale(.96);opacity:0;pointer-events:none;border-radius:16px}
  .ask.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:80;display:grid;gap:8px;width:min(92vw,380px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;font-size:13.5px;box-shadow:0 8px 24px #0003;animation:up .2s}
.toast.err{background:#7f1d1d}
@keyframes up{from{transform:translateY(8px);opacity:0}}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 500px at 50% -10%,#1F3A5F 0,#0f1b2d 60%)}
.lcard{width:min(100%,360px);background:var(--card);border-radius:18px;padding:26px 22px;box-shadow:0 20px 50px #0006}
.lcard .mark{width:42px;height:42px;font-size:20px;border-radius:12px;margin-bottom:14px}
.lcard h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.lcard p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.lcard label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.lcard input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:22px;letter-spacing:.5em;text-align:center}
.lcard input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--ring)}
.lcard .btn{width:100%;margin-top:12px;min-height:48px;font-size:15px}
.lerr{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="login" id="login" hidden>
  <form class="lcard" id="lf" autocomplete="off">
    <div class="mark" aria-hidden="true">V</div>
    <h1>VAJRA Admin</h1>
    <p>Orders &amp; samples. Enter the team PIN.</p>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="current-password" required>
    <button class="btn dark" type="submit" id="lbtn">Continue</button>
    <div class="lerr" id="lerr" role="alert"></div>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><div class="mark" aria-hidden="true">V</div><div><b>Orders</b><small id="upd">VAJRA Admin</small></div></div>
      <div class="sp"></div>
      <button class="ib" id="reload" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button class="ib" id="logout" aria-label="Log out"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </header>

  <div class="wrap split">
    <main>
      <div class="stats" role="group" aria-label="Quick filters">
        <button class="stat" data-f="dispatch"><span class="n" id="s-dispatch">–</span><span class="l"><span class="dot" style="background:var(--amber)"></span>To dispatch</span></button>
        <button class="stat" data-f="ask"><span class="n" id="s-ask">–</span><span class="l"><span class="dot" style="background:var(--green)"></span>Get feedback</span></button>
        <button class="stat" data-f="follow"><span class="n" id="s-follow">–</span><span class="l"><span class="dot" style="background:var(--blue)"></span>Follow up</span></button>
        <button class="stat" data-f="hot"><span class="n" id="s-hot">–</span><span class="l"><span class="dot" style="background:var(--orange)"></span>Hot / ordered</span></button>
      </div>

      <div class="tools">
        <div class="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label class="sr" for="q">Search orders</label>
          <input id="q" type="search" placeholder="Search name, phone, city" enterkeyhint="search" autocomplete="off">
          <button class="clr" id="qclr" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="seg" role="group" aria-label="Item type">
          <button data-t="all" aria-pressed="true">All<span class="c" id="t-all"></span></button>
          <button data-t="Sample">Samples<span class="c" id="t-Sample"></span></button>
          <button data-t="Full sheet">Full sheet<span class="c" id="t-Full sheet"></span></button>
          <button data-t="Nov">This month<span class="c" id="t-Nov"></span></button>
        </div>
      </div>

      <div class="list" id="list" aria-live="polite"></div>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="sheet idle" id="sheet" aria-label="Order details" aria-modal="false">
      <div class="grab" aria-hidden="true"></div>
      <div class="sh-h" id="shh"></div>
      <div class="sh-b" id="shb"></div>
    </aside>
  </div>
</div>

<div class="scrim2" id="scrim2" hidden></div>
<div class="ask" id="ask" role="dialog" aria-modal="true" aria-labelledby="askT" hidden>
  <h4 id="askT">Tracking ID</h4>
  <p id="askP"></p>
  <div class="field"><label class="sr" for="askI">Value</label><input id="askI" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
  <div class="row2"><button class="btn" id="askNo" type="button">Cancel</button><button class="btn dark" id="askOk" type="button">Save</button></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
let DATA = { orders: [], statuses: [], feedback: [] }, F = "all", T = "all", SEL = null;

/* ---------- icons ---------- */
const P = {
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  wa: '<path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.4L3 21l2.2-5.3A8.4 8.4 0 1 1 21 11.5z"/>',
  truck: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>', chev: '<path d="M9 18l6-6-6-6"/>', check: '<path d="M20 6L9 17l-5-5"/>',
  pin: '<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', star: '<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
};
const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- api ---------- */
async function api(a, opt = {}) {
  const r = await fetch("/api/admin?a=" + a, { credentials: "same-origin", ...opt,
    headers: { "Content-Type": "application/json", "X-Vajra-Admin": "1" } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && a !== "login") { screen("login"); throw new Error("login"); }
  if (!r.ok) throw new Error(j.error || "Error " + r.status);
  return j;
}
function screen(w) { $("#login").hidden = w !== "login"; $("#app").hidden = w !== "app"; if (w === "login") setTimeout(() => $("#pin").focus(), 50); }
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : "");
  t.innerHTML = ic(err ? "x" : "check"); t.append(document.createTextNode(msg)); $("#toasts").append(t);
  setTimeout(() => t.remove(), err ? 4500 : 2200);
}

/* ---------- order logic (same rules as the Google Sheet) ---------- */
const first = (n) => ((n || "").replace(/^(shri|mohd\.?|md\.?|er\.?) +/i, "").match(/^[A-Za-z]+/) || [""])[0];
// first number only when a cell has two ("9333985007;93349 85007"), same as the sheet's buttons
const digits = (o) => (String(o.phone || "").split(/[;,/|]/)[0] || "").replace(/\D/g, "").slice(-10);
const waLink = (o, text) => "https://wa.me/91" + digits(o) + "?text=" + encodeURIComponent(text);
const itemTxt = (o) => (o.item || "sample").toLowerCase();
const isTrack = (t) => /^(?=.*\d)[A-Za-z0-9-]{8,}$/.test(t || "");
const notSent = (o) => /Pending|Not sent|^$/.test(o.status || "") && !o.tracking;
const sentLike = (o) => /Sent|Delivered/.test(o.status || "");
const MSG = {
  addr: (o) => `Namaste ${first(o.name)} ji 🙏 VAJRA se. Aapka ${itemTxt(o)} bhejne ke liye apna poora address aur pincode confirm kar dijiye, hum jaldi dispatch karenge. Kuch poochna ho to: 83050 70160. - Team VAJRA`,
  track: (o) => `Namaste ${first(o.name)} ji 🙏 VAJRA se aapka ${itemTxt(o)} parcel bhej diya gaya hai. Tracking ID: ${o.tracking}. 2-5 din mein pahunch jayega. Kuch bhi poochna ho to call/WhatsApp karein: 83050 70160. - Team VAJRA`,
  ask: (o) => `Namaste ${first(o.name)} ji 🙏 VAJRA ka ${itemTxt(o)} mil gaya hoga. Kaisa laga? Ek line mein bata dijiye, site par use kiya ho to photo bhi bhejein. Full sheet order ke liye: 83050 70160. - Team VAJRA`,
};
const GROUP = {
  all: () => true,
  dispatch: notSent,
  ask: (o) => sentLike(o) && (!o.feedback || o.feedback === "Asked"),
  follow: (o) => /Call back|Thinking|estimate|5\+ sheets|Quote sent|No answer/.test(o.status || ""),
  hot: (o) => /Hot|Ordered/.test(o.status || ""),
};
function tone(s = "") {
  if (/Pending|Not sent/.test(s)) return "t-amber";
  if (/Sent|Delivered/.test(s)) return "t-green";
  if (/Hot|Ordered/.test(s)) return "t-orange";
  if (/Not interested/.test(s)) return "t-red";
  if (/Call back|Thinking|estimate|Quote|5\+|No answer/.test(s)) return "t-blue";
  return "";
}
const label = (s) => (s || "No status").replace(/^\S+\s/, "");   // drop the emoji for the badge
function nextStep(o) {
  if (notSent(o)) return { t: "Confirm address", i: "pin" };
  if (o.tracking && isTrack(o.tracking) && !o.tracking_sent) return { t: "Send tracking", i: "truck" };
  if (sentLike(o) && !o.feedback) return { t: "Ask feedback", i: "wa" };
  if (o.feedback === "Asked") return { t: "Waiting for reply", i: "wa" };
  if (/Call back|No answer/.test(o.status || "")) return { t: "Call again", i: "phone" };
  return null;
}
const AVC = { "t-amber": ["#fef3c7", "#92400e"], "t-green": ["#dcfce7", "#166534"], "t-orange": ["#ffedd5", "#9a3412"], "t-red": ["#fee2e2", "#991b1b"], "t-blue": ["#e0e7ff", "#3730a3"], "": ["#f4f4f5", "#3f3f46"] };
const initials = (n) => (n || "?").replace(/\(.*?\)/g, "").replace(/^(shri|mohd\.?|md\.?|er\.?) +/i, "").trim().split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("").toUpperCase() || "?";
const cap = (s) => String(s || "").toLowerCase().replace(/(^|[\s(-])\p{L}/gu, (m) => m.toUpperCase());   // "new delhi" -> "New Delhi"
const place = (o, full) => [cap(o.city), full ? (o.state && o.state.length <= 3 ? o.state.toUpperCase() : cap(o.state)) : ""].filter(Boolean).join(", ");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- list ---------- */
function visible() {
  const q = $("#q").value.trim().toLowerCase();
  return DATA.orders.slice().reverse().filter(GROUP[F]).filter((o) => T === "all" || o.item === T || o.month === T)
    .filter((o) => !q || [o.name, o.phone, o.city, o.state, o.tracking, o.notes, o.address].join(" ").toLowerCase().includes(q));
}
function render() {
  const os = DATA.orders;
  for (const k of ["dispatch", "ask", "follow", "hot"]) $("#s-" + k).textContent = os.filter(GROUP[k]).length;
  $$(".stat").forEach((b) => b.setAttribute("aria-pressed", b.dataset.f === F));
  const base = os.filter(GROUP[F]);
  $("#t-all").textContent = base.length;
  for (const t of ["Sample", "Full sheet", "Nov"]) document.getElementById("t-" + t).textContent = base.filter((o) => o.item === t || o.month === t).length;
  $$(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === T));
  $("#qclr").hidden = !$("#q").value;
  const v = visible();
  if (!v.length) { $("#list").innerHTML = `<div class="empty"><b>No orders here</b>Try another filter or clear the search.</div>`; return; }
  $("#list").innerHTML = v.map((o) => {
    const tn = tone(o.status), [bg, fg] = AVC[tn], nx = nextStep(o);
    const sub = [place(o), o.item + (o.qty && o.qty !== "1" ? " ×" + o.qty : "")].filter(Boolean).join(" · ");
    return `<button class="item" data-row="${o.row}" aria-current="${SEL === o.row}">
      <span class="av" style="background:${bg};color:${fg}" aria-hidden="true">${esc(initials(o.name))}</span>
      <span class="mid"><div class="nm">${esc(o.name || "(no name)")}</div><div class="sub">${esc(sub)}</div>
        ${nx ? `<span class="next">${ic(nx.i)}${esc(nx.t)}</span>` : ""}</span>
      <span class="rt"><span class="badge ${tn}"><i></i>${esc(label(o.status))}</span><span class="month">${esc(o.month)} · #${esc(o.n || o.row - 1)}</span></span>
    </button>`;
  }).join("");
}
function skeleton() {
  $("#list").innerHTML = Array.from({ length: 7 }, () =>
    `<div class="sk"><span style="width:38px;height:38px;border-radius:50%"></span><span style="flex:1"><span style="height:12px;width:55%;margin-bottom:8px"></span><span style="height:10px;width:35%"></span></span><span style="width:64px;height:20px;border-radius:99px"></span></div>`).join("");
}

/* ---------- detail ---------- */
const byRow = (r) => DATA.orders.find((o) => o.row === r);
function openDetail(row) {
  SEL = row; const o = byRow(row); if (!o) return;
  const sh = $("#sheet"); sh.classList.remove("idle");
  drawDetail(o); render();
  if (matchMedia("(max-width:959px)").matches) {
    $("#scrim").hidden = false; requestAnimationFrame(() => { $("#scrim").classList.add("on"); sh.classList.add("on"); });
    document.body.style.overflow = "hidden"; sh.setAttribute("aria-modal", "true");
    setTimeout(() => $(".x", sh)?.focus(), 260);
  }
}
function closeDetail() {
  const sh = $("#sheet"); sh.classList.remove("on"); $("#scrim").classList.remove("on");
  setTimeout(() => { $("#scrim").hidden = true; }, 200); document.body.style.overflow = ""; SEL = null; render();
  if (!matchMedia("(max-width:959px)").matches) sh.classList.add("idle");
}
function drawDetail(o) {
  const tn = tone(o.status), [bg, fg] = AVC[tn];
  $("#shh").innerHTML = `<span class="av" style="background:${bg};color:${fg};width:44px;height:44px;font-size:15px" aria-hidden="true">${esc(initials(o.name))}</span>
    <div class="mid"><div class="nm">${esc(o.name)}</div><div class="sub" style="white-space:normal">${esc(place(o, true))} · ${esc(o.month)} · #${esc(o.n || o.row - 1)}</div>
      <div style="margin-top:6px"><span class="badge ${tn}"><i></i>${esc(label(o.status))}</span></div></div>
    <button class="x" data-act="close" aria-label="Close">${ic("x")}</button>`;

  // primary actions: call + the WhatsApp message that fits this order's state
  const acts = [`<a class="btn" href="tel:+91${digits(o)}">${ic("phone")}Call</a>`];
  if (notSent(o)) acts.push(`<a class="btn pri" data-act="wa" data-kind="addr" href="${waLink(o, MSG.addr(o))}" target="_blank" rel="noopener">${ic("wa")}Ask address</a>`);
  // only the next step is highlighted: tracking first, then feedback
  const trackFirst = isTrack(o.tracking) && !o.tracking_sent;
  if (isTrack(o.tracking)) acts.push(`<a class="btn ${trackFirst ? "pri" : ""}" data-act="wa" data-kind="track" href="${waLink(o, MSG.track(o))}" target="_blank" rel="noopener">${ic("truck")}${o.tracking_sent ? "Resend tracking" : "Send tracking"}</a>`);
  if (!notSent(o)) acts.push(`<a class="btn ${!trackFirst && !o.feedback ? "pri" : ""}" data-act="wa" data-kind="ask" href="${waLink(o, MSG.ask(o))}" target="_blank" rel="noopener">${ic("wa")}Ask feedback</a>`);
  while (acts.length < 3) acts.push(`<button class="btn dark" data-act="track">${ic("plus")}Tracking</button>`);

  const kv = (k, v, extra = "", mono = false) => `<div class="kv"><span class="k">${k}</span><span class="v${mono ? " mono" : ""}">${v || '<span style="color:var(--muted2)">–</span>'}</span>${extra}</div>`;
  const copyBtn = (val, what) => val ? `<button class="mini" data-act="copy" data-val="${esc(val)}" aria-label="Copy ${what}">${ic("copy")}</button>` : "";

  $("#shb").innerHTML = `
    <div class="acts">${acts.slice(0, 3).join("")}</div>

    <section class="sec"><h3>Shipping</h3>
      ${kv("Tracking", esc(o.tracking), (o.tracking ? copyBtn(o.tracking, "tracking ID") : "") + `<button class="mini" data-act="track" aria-label="${o.tracking ? "Edit" : "Add"} tracking ID">${ic(o.tracking ? "edit" : "plus")}</button>`, true)}
      <div class="kv"><span class="k">Customer told</span><span class="v toggle"><button class="sw" role="switch" data-act="tsent" aria-checked="${!!o.tracking_sent}" aria-label="Tracking sent to customer"></button>${o.tracking_sent ? "Tracking sent" : "Not yet"}</span></div>
      ${kv("Address", esc(o.address), copyBtn(o.address, "address"))}
    </section>

    <section class="sec"><h3>Order</h3>
      ${kv("Item", esc(o.item) + (o.qty ? " × " + esc(o.qty) : ""))}
      ${kv("Paid", esc(o.paid))}
      ${kv("Phone", esc(o.phone), copyBtn(digits(o), "phone"), true)}
    </section>

    <section class="sec"><h3>Status</h3>
      <div class="opts" role="group" aria-label="Status">${DATA.statuses.map((s) => `<button class="opt" data-act="status" data-val="${esc(s)}" aria-pressed="${s === o.status}">${esc(s)}</button>`).join("")}</div>
    </section>

    <section class="sec"><h3>Feedback</h3>
      <div class="fb" role="group" aria-label="Feedback">${DATA.feedback.map((f) => `<button class="opt" data-act="fb" data-val="${esc(f)}" aria-pressed="${f === (o.feedback || "")}">${esc(f || "None")}</button>`).join("")}</div>
    </section>

    <section class="sec"><h3>Notes</h3>
      <div class="note-wrap"><label class="sr" for="noteI">Notes</label><textarea id="noteI" placeholder="Add a note for the team">${esc(o.notes)}</textarea>
      <button class="btn sm dark" data-act="note">Save note</button></div>
    </section>`;
}

async function save(o, field, value, okMsg) {
  const before = { ...o };
  o[field] = field === "tracking_sent" ? value === "true" : value;   // optimistic
  if (SEL === o.row) drawDetail(o); render();
  try {
    const j = await api("update", { method: "POST", body: JSON.stringify({ row: o.row, field, value }) });
    if (j.status) o.status = j.status;
    if (SEL === o.row) drawDetail(o); render();
    toast((okMsg || "Saved") + (j.status ? " · status → " + label(j.status) : ""));
  } catch (e) {
    if (e.message === "login") return;
    Object.assign(o, before); if (SEL === o.row) drawDetail(o); render();
    toast("Not saved: " + e.message, true);
  }
}

/* ---------- tracking input sheet ---------- */
function askTracking(o) {
  const a = $("#ask"), s2 = $("#scrim2"), inp = $("#askI");
  $("#askT").textContent = o.tracking ? "Edit tracking ID" : "Add tracking ID";
  $("#askP").textContent = o.name + (notSent(o) ? " · status will change to Sent" : "");
  inp.value = o.tracking || ""; a.hidden = false; s2.hidden = false;
  requestAnimationFrame(() => a.classList.add("on")); setTimeout(() => inp.focus(), 120);
  const done = (val) => {
    a.classList.remove("on"); s2.hidden = true; setTimeout(() => { a.hidden = true; }, 220);
    $("#askOk").onclick = $("#askNo").onclick = s2.onclick = inp.onkeydown = null;
    if (val !== null && val !== (o.tracking || "")) save(o, "tracking", val, "Tracking saved");
  };
  $("#askOk").onclick = () => done(inp.value.trim().toUpperCase());
  $("#askNo").onclick = s2.onclick = () => done(null);
  inp.onkeydown = (e) => { if (e.key === "Enter") done(inp.value.trim().toUpperCase()); if (e.key === "Escape") done(null); };
}

/* ---------- events ---------- */
$("#list").addEventListener("click", (e) => { const b = e.target.closest(".item"); if (b) openDetail(Number(b.dataset.row)); });
$("#sheet").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const o = byRow(SEL); const act = b.dataset.act;
  if (act === "close") return closeDetail();
  if (!o) return;
  if (act === "copy") { try { await navigator.clipboard.writeText(b.dataset.val); toast("Copied"); } catch { toast("Copy not allowed here", true); } return; }
  if (act === "track") return askTracking(o);
  if (act === "tsent") return save(o, "tracking_sent", String(!o.tracking_sent), o.tracking_sent ? "Marked not sent" : "Marked as sent");
  if (act === "status") return b.dataset.val !== o.status && save(o, "status", b.dataset.val, "Status saved");
  if (act === "fb") return b.dataset.val !== (o.feedback || "") && save(o, "feedback", b.dataset.val, "Feedback saved");
  if (act === "note") { const v = $("#noteI").value; return v !== (o.notes || "") ? save(o, "notes", v, "Note saved") : toast("No change"); }
  if (act === "wa") {   // WhatsApp opens in a new tab; record what was sent
    if (b.dataset.kind === "track" && !o.tracking_sent) save(o, "tracking_sent", "true", "Tracking marked as sent");
    if (b.dataset.kind === "ask" && !o.feedback) save(o, "feedback", "Asked", "Feedback marked as asked");
  }
});
$("#scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && SEL && $("#ask").hidden) closeDetail(); });
$$(".stat").forEach((b) => b.addEventListener("click", () => { F = F === b.dataset.f ? "all" : b.dataset.f; render(); }));
$$(".seg button").forEach((b) => b.addEventListener("click", () => { T = b.dataset.t; render(); }));
$("#q").addEventListener("input", render);
$("#qclr").addEventListener("click", () => { $("#q").value = ""; render(); $("#q").focus(); });
$("#reload").addEventListener("click", () => load(true));
$("#logout").addEventListener("click", async () => { await api("logout", { method: "POST" }).catch(() => {}); screen("login"); });
// swipe down on the handle/header closes the sheet on phones
(() => { let y0 = null; const sh = $("#sheet");
  sh.addEventListener("touchstart", (e) => { if (e.target.closest(".sh-b")) return; y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener("touchend", (e) => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 70) closeDetail(); y0 = null; });
})();

$("#lf").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#lerr").textContent = ""; $("#lbtn").disabled = true; $("#lbtn").textContent = "Checking…";
  try { await api("login", { method: "POST", body: JSON.stringify({ pin: $("#pin").value }) }); $("#pin").value = ""; await load(); }
  catch (err) { $("#lerr").textContent = err.message === "Galat PIN" ? "Wrong PIN. Try again." : err.message; $("#pin").select(); }
  finally { $("#lbtn").disabled = false; $("#lbtn").textContent = "Continue"; }
});

async function load(manual) {
  if (!DATA.orders.length) skeleton();
  $("#reload").classList.add("spin");
  try {
    DATA = await api("orders"); screen("app"); render();
    if (SEL && byRow(SEL)) drawDetail(byRow(SEL));
    $("#upd").textContent = "Updated " + new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
    if (manual) toast("Refreshed");
  } catch (e) { if (e.message !== "login") toast("Could not load: " + e.message, true); }
  finally { $("#reload").classList.remove("spin"); }
}
screen("app"); load();
</script>
</body>
</html>
